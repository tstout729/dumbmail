[package]
name = "dumbmail"
description = "Open-source email and SMS marketing: campaigns, flows, segments and an MCP server"
license = "AGPL-3.0-only"
default-run = "dumbmail"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
async-trait = "0.1.92"
aws-config = { version = "1.13.2", features = ["behavior-version-latest"] }
aws-sdk-sesv2 = "1.147.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gif = "0.14.2"
hex = "0.4.3"
hmac = "0.12"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
mime_guess = "2.0.5"
minijinja = { version = "2", features = ["json", "urlencode", "loop_controls"] }
once_cell = "1.21.4"
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
roxmltree = "0.21"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
