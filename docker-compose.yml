# Self-host DumbMail: `cp .env.example .env`, edit it, then `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dumbmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dumbmail}
      POSTGRES_DB: dumbmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumbmail"]
      interval: 5s
      retries: 10

  dumbmail:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://dumbmail:${POSTGRES_PASSWORD:-dumbmail}@postgres:5432/dumbmail
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -base64 48)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env (openssl rand -hex 24)}
    ports:
      # Put a TLS reverse proxy (Caddy, nginx) in front; change to "8080:8080" to expose directly.
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
